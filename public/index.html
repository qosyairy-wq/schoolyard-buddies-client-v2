<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#59b9eb">
  <title>Schoolyard Buddies</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0c3560;background:#59b9eb}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(#68c4ef,#c9efff)}
    main{width:min(680px,100%);background:#eef9ff;border:4px solid #0a3768;border-radius:28px;padding:28px;text-align:center;box-shadow:0 10px 0 #092b53}
    img{width:min(460px,92%);height:auto}h1{margin:12px 0 8px;font-size:clamp(24px,5vw,40px)}p{font-weight:700;line-height:1.5}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{display:block;padding:16px;border:3px solid #082e59;border-radius:18px;background:#1879d4;color:#fff;text-decoration:none;font-weight:900;box-shadow:0 5px 0 #071f3d}.btn.primary{background:#ffc432;color:#103861}
    @media(max-width:540px){.buttons{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <img src="/assets/schoolyard-logo.png" alt="Schoolyard Buddies">
  <h1>Choose your device</h1>
  <p id="status">Detecting the best version…</p>
  <div class="buttons">
    <a class="btn primary" href="/mobile.html?manual=1&v=1.0.4">Mobile / Tablet</a>
    <a class="btn" href="/desktop.html?manual=1&v=1.0.4">Desktop PC</a>
  </div>
</main>
<script>
(() => {
  const query = new URLSearchParams(location.search);
  if (query.get('desktop') === '1') return location.replace('/desktop.html?source=router&v=1.0.4');
  if (query.get('mobile') === '1') return location.replace('/mobile.html?source=router&v=1.0.4');
  const coarse = matchMedia('(pointer: coarse)').matches;
  const small = Math.min(screen.width, screen.height) <= 900;
  const uaMobile = navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const destination = '/desktop.html?source=' + ((uaMobile || (coarse && small)) ? 'auto-mobile' : 'auto-desktop') + '&v=1.0.4';
  document.getElementById('status').textContent = (uaMobile || (coarse && small)) ? 'Opening the full game with mobile controls…' : 'Opening desktop version…';
  setTimeout(() => location.replace(destination), 120);
})();
</script>
</body>
</html>
