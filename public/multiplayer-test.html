<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schoolyard Multiplayer Test</title><style>body{font-family:system-ui;background:#eaf7ff;color:#0a315d;padding:20px}main{max-width:720px;margin:auto;background:#fff;border:3px solid #0a315d;border-radius:20px;padding:20px}input,button{font:inherit;padding:12px;border:2px solid #0a315d;border-radius:10px}input{width:100%;margin:6px 0 12px}button{background:#1677d4;color:#fff;font-weight:800}.log{height:260px;overflow:auto;background:#082f5d;color:#fff;padding:12px;border-radius:12px;white-space:pre-wrap}</style></head><body><main><h1>Multiplayer connection test</h1><label>WebSocket URL<input id="url"></label><label>Room<input id="room" value="schoolyard-main"></label><button id="connect">Connect</button> <button id="send">Send test chat</button><pre class="log" id="log"></pre></main><script src="/config.js"></script><script>const log=(v)=>{const e=document.getElementById('log');e.textContent+=v+'\n';e.scrollTop=e.scrollHeight};let ws;url.value=window.SYB_CONFIG?.websocketUrl||'';connect.onclick=()=>{const u=new URL(url.value);u.searchParams.set('room',room.value||'schoolyard-main');ws=new WebSocket(u);ws.onopen=()=>{log('OPEN');ws.send(JSON.stringify({type:'join',payload:{name:'Browser Test',appearance:{gender:'female',shirt:7909854},profile:{achievementLevel:1},state:{x:0,y:0,z:0,zone:'plaza'}}}))};ws.onmessage=e=>log('MESSAGE '+e.data);ws.onerror=()=>log('ERROR');ws.onclose=e=>log('CLOSE '+e.code)};send.onclick=()=>ws?.send(JSON.stringify({type:'chat',payload:{text:'Hello from multiplayer-test.html'}}));</script></body></html>
